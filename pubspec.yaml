name: zoya7_gold
description: Zoya7 — social casino app (lobby, wallet, promotions, chat, profile) with the Gold (Classic 777) slot.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  audioplayers: ^6.1.0
  archive: ^4.0.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/games/gold/
    - assets/games/gold/sounds/
    - assets/games/fruit/
    - assets/games/fruit/sounds/
    - assets/games/phoenix/
    - assets/games/phoenix/sounds/
    - assets/games/blackjack/sounds/
    - assets/app/
    - assets/app/avatars/
    - assets/sounds/
    - assets/sdk/
