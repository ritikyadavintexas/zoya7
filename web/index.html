<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zoya7 — social casino.">

  <!-- Draw edge to edge (under the notch, status bar and home indicator) when
       opened from the home screen. Flutter replaces this tag on start-up; the
       script below puts viewport-fit=cover back. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0806">

  <!-- iOS home-screen app: no browser chrome, page runs under a transparent status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zoya7">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zoya7</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0B0806;
      overscroll-behavior: none;
    }
  </style>

  <script>
    // Flutter swaps in its own <meta name="viewport"> without viewport-fit=cover,
    // which letterboxes the home-screen app on iPhones. Keep it on every viewport tag.
    (function () {
      function cover() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          var c = m.getAttribute('content') || '';
          if (c.indexOf('viewport-fit') < 0) m.setAttribute('content', c + ', viewport-fit=cover');
        });
      }
      new MutationObserver(cover).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      cover();
    })();

    // Flutter web reports no safe-area padding, so the app reads the notch /
    // home-indicator insets from CSS here: [top, right, bottom, left] in CSS px.
    window.zoyaSafeArea = function () {
      var p = document.getElementById('zoya-safe-area');
      if (!p) {
        p = document.createElement('div');
        p.id = 'zoya-safe-area';
        p.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
        document.body.appendChild(p);
      }
      var s = getComputedStyle(p);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(function (v) {
        return parseFloat(v) || 0;
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
