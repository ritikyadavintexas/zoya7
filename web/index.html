<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zoya7 — social casino.">

  <!-- Draw edge to edge (under the notch, status bar and home indicator) when
       opened from the home screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0806">

  <!-- iOS home-screen app: no browser chrome, page runs under a transparent status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zoya7">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zoya7</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0B0806;
      overscroll-behavior: none;
    }
    /* Flutter draws into this (see flutter_bootstrap.js). */
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <script>
    // Flutter web reports no safe-area padding, so the app reads the notch /
    // home-indicator insets from CSS here: [top, right, bottom, left] in CSS px.
    window.zoyaStandalone = function () {
      return !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
    };
    window.zoyaSafeArea = function () {
      var p = document.getElementById('zoya-safe-area');
      if (!p) {
        p = document.createElement('div');
        p.id = 'zoya-safe-area';
        p.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
        document.body.appendChild(p);
      }
      var s = getComputedStyle(p);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(function (v) {
        return parseFloat(v) || 0;
      });
    };
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="viewport.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
