<!DOCTYPE html>
<html>
<head>
  <!-- The admin app is the same Flutter build as the game, opened in admin
       mode. Its files live one folder up. -->
  <base href="../">

  <meta charset="UTF-8">
  <meta name="description" content="Zoya7 admin panel">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#00D632">

  <!-- Its own home-screen app: own name, icon and (portrait) orientation. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Z7 Admin">
  <link rel="apple-touch-icon" href="admin/icons/admin-apple-180.png">
  <link rel="icon" type="image/png" href="admin/icons/admin-192.png">
  <link rel="manifest" href="admin/manifest.json">

  <title>Zoya7 Admin</title>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F4F5; overscroll-behavior: none; }
    #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>

  <script>
    window.zoyaApp = 'admin';
    window.zoyaStandalone = function () {
      return !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
    };
    window.zoyaSafeArea = function () {
      var p = document.getElementById('zoya-safe-area');
      if (!p) {
        p = document.createElement('div');
        p.id = 'zoya-safe-area';
        p.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
          'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
        document.body.appendChild(p);
      }
      var s = getComputedStyle(p);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(function (v) { return parseFloat(v) || 0; });
    };
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
