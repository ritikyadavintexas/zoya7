<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#081a1b" />
  <title>Bloom Atelier • Zoya7</title>
  <style>
    * { box-sizing: border-box; }
    html,body { width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#081a1b;touch-action:none; }
    #game { width:100%;height:100%;display:block;touch-action:none;outline:0; }
    #portrait {display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:9;background:radial-gradient(circle at 50% 40%,#214d42,#08191b);color:#ebdbb8;padding:36px;text-align:center;font:17px/1.6 system-ui,sans-serif;}
    #portrait strong {display:block;font:34px Georgia,serif;margin-bottom:15px;font-weight:normal;}
    @media(orientation:portrait){#portrait{display:flex} #game{visibility:hidden}}
  </style>
</head>
<body>
  <canvas id="game" role="application" aria-label="Bloom Atelier, a Zoya7 instant game. Use Space or Enter to grow; left and right arrows change the bet, and Escape exits."></canvas>
  <div id="portrait"><div><strong>Bloom Atelier</strong>Turn your device to landscape to enter the glasshouse.</div></div>
  <script src="zoya7-bridge.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
